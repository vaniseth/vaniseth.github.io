<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vani Seth</title>
  <meta name="description" content="Vani Seth — Ph.D. student in Computer Science at the University of Missouri, working on trustworthy and secure LLMs, retrieval and reasoning for science, and AI for healthcare.">
  <meta property="og:title" content="Vani Seth">
  <meta property="og:description" content="Ph.D. student in Computer Science at the University of Missouri. Trustworthy & secure LLMs, scientific RAG, healthcare AI.">
  <meta property="og:type" content="profile">
  <meta property="og:image" content="images/profile.jpg">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

  <!-- Set theme + accent before first paint (avoids a light flash in dark mode) -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav class="nav container" aria-label="Main">
      <a class="nav-name" href="#top" data-bind="name">Vani Seth</a>
      <button class="nav-menu-btn" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="nav-links" id="nav-links">
        <a href="#about">About</a>
        <a href="#research">Research</a>
        <a href="#news">News</a>
        <a href="#publications">Publications</a>
        <a href="#honors">Awards &amp; Talks</a>
        <a href="#gallery">Gallery</a>
        <a href="#" id="nav-cv">CV</a>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </header>

  <main id="main" class="container">
    <span id="top"></span>

    <!-- About -->
    <section id="about" class="hero">
      <div class="hero-photo" id="hero-photo"></div>
      <div class="hero-text">
        <div>
          <h1 data-bind="name">Vani Seth</h1>
          <p class="hero-role" id="hero-role"></p>
        </div>
        <p class="callout" id="hero-callout" hidden></p>
        <div class="hero-bio" id="hero-bio"></div>
        <div class="pill-row" id="profile-links"></div>
      </div>
    </section>

    <!-- News -->
    <section id="news" class="section">
      <h2>News</h2>
      <ul class="row-list" id="news-list"></ul>
      <button class="text-btn" id="news-more" type="button" aria-expanded="false" hidden>Show older news</button>
    </section>

    <!-- Research -->
    <section id="research" class="section">
      <div class="section-head">
        <div>
          <h2>Research</h2>
          <p class="section-sub">My work centers around three themes. Select one to filter the publications below.</p>
        </div>
      </div>
      <div class="theme-grid" id="theme-cards"></div>
    </section>


    <!-- Publications -->
    <section id="publications" class="section">
      <div class="section-head">
        <h2>Publications</h2>
        <div class="chip-row" id="pub-chips" role="group" aria-label="Filter publications by theme"></div>
      </div>
      <p class="meta-line" id="pub-count" aria-live="polite"></p>
      <div class="pub-list" id="pub-list"></div>
    </section>

    <!-- Awards / Experience / Education / Talks / Grants -->
    <section id="honors" class="section">
      <h2>Beyond Papers</h2>
      <div class="tabs" id="tabs" role="tablist" aria-label="Awards, experience, education, talks, reviews, and grants"></div>
      <div id="tab-panels"></div>
    </section>

    <!-- Gallery -->
    <section id="gallery" class="section">
      <div class="section-head">
        <h2>Gallery</h2>
        <div class="chip-row" id="gal-chips" role="group" aria-label="Filter photos"></div>
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span id="footer-copy"></span>
      <span id="footer-updated"></span>
    </div>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <button class="lightbox-close" type="button" aria-label="Close photo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <img id="lightbox-img" alt="">
    <p id="lightbox-caption"></p>
  </dialog>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
